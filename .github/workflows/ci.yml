name: CI

# 推主干与所有 PR 都跑：与本地「三绿门禁」完全相同的步骤
# （tsc → node:test → production 构建），外加产物大小断言。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 产物大小断言
        run: |
          SIZE=$(wc -c < main.js)
          echo "main.js: ${SIZE} bytes"
          # 主包当前约 168KB（minified，obsidian 是 external 不进包）。
          # 超过 512KB 说明把不该带的东西打进去了（比如误引入运行时依赖），先查再合。
          LIMIT=512000
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::main.js 超过 ${LIMIT} bytes（当前 ${SIZE}）。检查是否误把运行时依赖打了进去。"
            exit 1
          fi
